[workspace]
resolver = "2"
members = ["engine", "cli", "app/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["zavants <info@zavants.com>", "Claude (Anthropic) <noreply@anthropic.com>"]
repository = "https://github.com/zavants/VectorFree"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Image processing is far too slow unoptimized; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1
