[workspace]
resolver = "2"
members = ["engine", "cli", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Image processing is far too slow unoptimized; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1
